<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insurance Record</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; padding: 24px;
      background: #f4f6f9; color: #1a1f2b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #11151c; color: #e7eaf0; }
      .card { background: #1a1f2b !important; border-color: #2a3240 !important; }
      .row { border-color: #2a3240 !important; }
      .label { color: #9aa4b2 !important; }
    }
    .card {
      max-width: 560px; margin: 0 auto; background: #fff;
      border: 1px solid #e2e6ec; border-radius: 14px;
      padding: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.06);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #6b7482; margin: 0 0 20px; }
    .row {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 14px 0; border-bottom: 1px solid #eef1f5;
    }
    .row:last-child { border-bottom: none; }
    .label { font-size: 13px; color: #6b7482; font-weight: 600; }
    .value { font-size: 15px; text-align: right; word-break: break-word; }
    .empty { opacity: .45; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Insurance Record</h1>
    <p class="sub">Live values &middot; updated via the API</p>

    <div class="row">
      <span class="label">Insured Name</span>
      <span class="value" id="insured_name"></span>
    </div>
    <div class="row">
      <span class="label">Country</span>
      <span class="value" id="country"></span>
    </div>
    <div class="row">
      <span class="label">Premium</span>
      <span class="value" id="premium"></span>
    </div>
    <div class="row">
      <span class="label">Limit</span>
      <span class="value" id="limit"></span>
    </div>
    <div class="row">
      <span class="label">Insured Address</span>
      <span class="value" id="insured_address"></span>
    </div>
  </div>

  <script>
    const FIELDS = ["insured_name", "country", "premium", "limit", "insured_address"];

    function render(data) {
      for (const f of FIELDS) {
        const el = document.getElementById(f);
        const v = data[f];
        if (v === "" || v == null) {
          el.textContent = "—";
          el.classList.add("empty");
        } else {
          el.textContent = v;
          el.classList.remove("empty");
        }
      }
    }

    async function refresh() {
      try {
        const res = await fetch("/api/record", { cache: "no-store" });
        if (res.ok) render(await res.json());
      } catch (e) { /* ignore transient errors */ }
    }

    refresh();
    setInterval(refresh, 3000); // auto-refresh so API updates show up live
  </script>
</body>
</html>
